name: oqelira
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: oqelira
      POSTGRES_DB: oqelira
      POSTGRES_PASSWORD: ${OQELIRA_DB_PASSWORD:?Run npm run setup:server first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oqelira -d oqelira"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
