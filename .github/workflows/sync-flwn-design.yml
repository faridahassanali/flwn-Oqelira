name: sync-flwn-design

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  SKILL_DIR: .agents/skills/flwn-design

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync from a-elhaag/flwn-design and push to the default branch
        run: |
          git clone --depth 1 https://github.com/a-elhaag/flwn-design.git /tmp/skill
          mkdir -p "$SKILL_DIR"
          rsync -a --no-links --delete /tmp/skill/flwn-design/ "$SKILL_DIR"/
          [ -z "$(git status --porcelain "$SKILL_DIR")" ] && { echo "already up to date"; exit 0; }
          git config user.name "flwn-design-sync"
          git config user.email "noreply@github.com"
          git add -A "$SKILL_DIR"
          git commit -m "chore: sync flwn-design skill from a-elhaag/flwn-design@$(git -C /tmp/skill rev-parse --short HEAD)"
          # Needs the github-actions app as a bypass actor on branch protection.
          git push origin HEAD:${{ github.event.repository.default_branch }}
